<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="256" cy="256" r="240" fill="url(#skyGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Laurel Wreath Leaves (Left & Right) -->
  <g fill="url(#goldGrad)" opacity="0.85">
    <!-- Left Wreath -->
    <path d="M120,340 C100,310 95,260 110,210 C115,225 125,235 120,340 Z"/>
    <circle cx="105" cy="280" r="10"/>
    <circle cx="115" cy="230" r="9"/>
    <circle cx="135" cy="185" r="8"/>
    <circle cx="165" cy="150" r="8"/>
    <!-- Right Wreath -->
    <path d="M392,340 C412,310 417,260 402,210 C397,225 387,235 392,340 Z"/>
    <circle cx="407" cy="280" r="10"/>
    <circle cx="397" cy="230" r="9"/>
    <circle cx="377" cy="185" r="8"/>
    <circle cx="347" cy="150" r="8"/>
  </g>

  <!-- Open Book Base -->
  <g id="openBook">
    <!-- Book Pages Shadow -->
    <path d="M140,360 Q256,390 372,360 L360,385 Q256,410 152,385 Z" fill="#1E1B4B" opacity="0.4"/>
    <!-- Book Left Page -->
    <path d="M256,370 Q190,340 130,350 L140,300 Q195,295 256,315 Z" fill="url(#bookGrad)" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Book Right Page -->
    <path d="M256,370 Q322,340 382,350 L372,300 Q317,295 256,315 Z" fill="url(#bookGrad)" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Book Spine Ribbon -->
    <path d="M252,315 L252,395 L256,390 L260,395 L260,315 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Wise Owl Character -->
  <g id="owlBody" transform="translate(0, -10)">
    <!-- Owl Belly -->
    <ellipse cx="256" cy="245" rx="70" ry="75" fill="#312E81"/>
    <!-- Feathers / Chest -->
    <ellipse cx="256" cy="260" rx="46" ry="50" fill="#FEF3C7"/>
    <!-- Feather scalloped markings -->
    <path d="M236,245 Q246,255 256,245 Q266,255 276,245" fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>
    <path d="M242,265 Q252,275 262,265 Q272,275 270,265" fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>

    <!-- Owl Eyes Outer -->
    <circle cx="220" cy="180" r="34" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="6"/>
    <circle cx="292" cy="180" r="34" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="6"/>

    <!-- Spectacles Bridge -->
    <path d="M246,180 Q256,172 266,180" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>

    <!-- Pupils -->
    <circle cx="224" cy="180" r="18" fill="#1E1B4B"/>
    <circle cx="288" cy="180" r="18" fill="#1E1B4B"/>
    <!-- Eye Sparkles -->
    <circle cx="218" cy="174" r="6" fill="#FFFFFF"/>
    <circle cx="282" cy="174" r="6" fill="#FFFFFF"/>
    <circle cx="228" cy="186" r="2.5" fill="#FFFFFF"/>
    <circle cx="292" cy="186" r="2.5" fill="#FFFFFF"/>

    <!-- Golden Beak -->
    <polygon points="256,192 246,212 266,212" fill="url(#goldGrad)"/>

    <!-- Graduation Mortarboard Cap -->
    <g id="cap">
      <!-- Cap Skullcap -->
      <path d="M226,140 Q256,130 286,140 L280,150 Q256,145 232,150 Z" fill="#1E1B4B"/>
      <!-- Cap Diamond Top -->
      <polygon points="256,105 325,128 256,150 187,128" fill="#1E1B4B" stroke="url(#goldGrad)" stroke-width="3"/>
      <!-- Cap Tassel Button -->
      <circle cx="256" cy="128" r="5" fill="url(#goldGrad)"/>
      <!-- Hanging Tassel -->
      <path d="M256,128 C280,135 300,155 305,170" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="305" cy="172" r="5" fill="url(#goldGrad)"/>
    </g>
  </g>

  <!-- Stars of Excellence -->
  <g fill="url(#goldGrad)">
    <polygon points="256,40 262,56 278,56 265,66 270,82 256,72 242,82 247,66 234,56 250,56" transform="translate(0, 0) scale(0.9) translate(28, 10)"/>
    <circle cx="205" cy="65" r="4"/>
    <circle cx="307" cy="65" r="4"/>
  </g>

  <!-- Bottom Elegant Ribbon Banner -->
  <g id="bottomRibbon">
    <path d="M96,415 L160,395 L352,395 L416,415 L400,450 L352,435 L160,435 L112,450 Z" fill="#1E1B4B" stroke="url(#goldGrad)" stroke-width="4"/>
    <text x="256" y="422" font-family="'Fredoka', 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
      ΜΑΘΑΙΝΟΥΜΕ ΜΑΖΙ
    </text>
    <text x="256" y="465" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#FEF08A" text-anchor="middle" letter-spacing="1">
      ΘΕΟΔΟΣΙΑ ΔΕΜΕΝΙΔΟΥ • ΔΗΜΟΤΙΚΟ
    </text>
  </g>
</svg>
