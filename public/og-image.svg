<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Subtle Educational Grid Pattern -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1.5">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Left Side: Large Crest (Center at x=280, y=315) -->
  <g transform="translate(280, 315) scale(0.95) translate(-256, -256)">
    <!-- Outer Glow & Ring -->
    <circle cx="256" cy="256" r="236" fill="url(#cardG)" stroke="url(#goldG)" stroke-width="14"/>
    <circle cx="256" cy="256" r="222" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="8 6"/>

    <!-- Open Book -->
    <path d="M256,365 Q180,330 115,345 L125,300 Q185,295 256,315 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <path d="M256,365 Q332,330 397,345 L387,300 Q327,295 256,315 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <path d="M252,315 L252,390 L256,385 L260,390 L260,315 Z" fill="url(#goldG)"/>

    <!-- Owl -->
    <ellipse cx="256" cy="235" rx="80" ry="85" fill="#1E1B4B"/>
    <ellipse cx="256" cy="255" rx="54" ry="58" fill="#FEF3C7"/>
    <!-- Eyes -->
    <circle cx="215" cy="170" r="38" fill="#FFFFFF" stroke="url(#goldG)" stroke-width="7"/>
    <circle cx="297" cy="170" r="38" fill="#FFFFFF" stroke="url(#goldG)" stroke-width="7"/>
    <circle cx="220" cy="170" r="20" fill="#1E1B4B"/>
    <circle cx="292" cy="170" r="20" fill="#1E1B4B"/>
    <circle cx="212" cy="162" r="7" fill="#FFFFFF"/>
    <circle cx="284" cy="162" r="7" fill="#FFFFFF"/>
    <!-- Beak -->
    <polygon points="256,185 244,210 268,210" fill="url(#goldG)"/>
    <!-- Mortarboard Cap -->
    <polygon points="256,85 345,115 256,145 167,115" fill="#1E1B4B" stroke="url(#goldG)" stroke-width="5"/>
    <circle cx="256" cy="115" r="7" fill="url(#goldG)"/>
    <path d="M256,115 Q310,135 320,175" fill="none" stroke="url(#goldG)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="320" cy="177" r="7" fill="url(#goldG)"/>
  </g>

  <!-- Right Side: Content Block -->
  <g transform="translate(560, 0)">
    <!-- Header Pill -->
    <rect x="0" y="110" width="310" height="38" rx="19" fill="#312E81" stroke="url(#goldG)" stroke-width="2"/>
    <text x="22" y="135" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="900" fill="#FDE047" letter-spacing="2">
      ★ ΠΡΩΤΟΒΑΘΜΙΑ ΕΚΠΑΙΔΕΥΣΗ ★
    </text>

    <!-- Main Title -->
    <text x="0" y="235" font-family="'Fredoka', 'Segoe UI', system-ui, sans-serif" font-size="72" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      Μαθαίνουμε Μαζί
    </text>

    <!-- Educator Title -->
    <text x="0" y="295" font-family="'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="800" fill="#93C5FD">
      Θεοδοσία Δεμενίδου
      <tspan font-weight="500" fill="#CBD5E1"> • Εκπαιδευτικός</tspan>
    </text>

    <!-- Description -->
    <text x="0" y="355" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="600" fill="#E2E8F0">
      Δωρεάν Φύλλα Εργασίας, Ασκήσεις &amp; PDF για το Δημοτικό
    </text>

    <!-- Badge Pills Row -->
    <g transform="translate(0, 395)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="150" height="42" rx="14" fill="#3730A3" stroke="#6366F1" stroke-width="1.5"/>
      <text x="18" y="27" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">
        🎒 6 Τάξεις
      </text>

      <!-- Pill 2 -->
      <rect x="165" y="0" width="185" height="42" rx="14" fill="#3730A3" stroke="#6366F1" stroke-width="1.5"/>
      <text x="180" y="27" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">
        🖨️ Εκτύπωση A4
      </text>

      <!-- Pill 3 -->
      <rect x="365" y="0" width="200" height="42" rx="14" fill="#3730A3" stroke="#6366F1" stroke-width="1.5"/>
      <text x="380" y="27" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">
        🦉 Βοηθός Μελέτης
      </text>
    </g>

    <!-- Domain Footer -->
    <text x="0" y="500" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="700" fill="#94A3B8" letter-spacing="1">
      theodosia-demenidou-education.vercel.app
    </text>
  </g>
</svg>
